# docker-compose.yml

services:
  postgres:
    image: postgres:17
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./oltp/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    environment:
      RUSTFS_ACCESS_KEY_ID: "${RUSTFS_ACCESS_KEY:-minioadmin}"
      RUSTFS_SECRET_ACCESS_KEY: "${RUSTFS_SECRET_KEY:-minioadmin}"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15

  oltp-api:
    build:
      context: ./app
    command: ["python", "-m", "oltp_api"]
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy

  extractor:
    build:
      context: ./app
    command: ["python", "-m", "extractor"]
    env_file: .env
    environment:
      OLTP_API_URL: "http://oltp-api:8001"
      RUSTFS_ENDPOINT: "rustfs:9000"
      RUSTFS_ACCESS_KEY: "${RUSTFS_ACCESS_KEY:-minioadmin}"
      RUSTFS_SECRET_KEY: "${RUSTFS_SECRET_KEY:-minioadmin}"
      EXTRACT_INTERVAL: "${EXTRACT_INTERVAL:-30}"
    depends_on:
      oltp-api:
        condition: service_started
      rustfs:
        condition: service_healthy

  portifolio-api:
    build:
      context: ./app
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  mutator:
    build:
      context: ./app
    command: ["python", "-m", "portfolio_api.mutator"]
    env_file: .env
    environment:
      OLTP_API_URL: "http://oltp-api:8001"
      MUTATE_INTERVAL: "${MUTATE_INTERVAL:-10}"
    depends_on:
      oltp-api:
        condition: service_started

volumes:
  postgres_data:
  rustfs_data:
