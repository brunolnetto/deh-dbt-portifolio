# ecommerce/profiles.yml
#
# dbt-postgres: reads from PostgreSQL landing schemas (populated by extractor)
# and writes to PostgreSQL analytics schemas.
# Run: dbt build --profiles-dir ecommerce/

portfolio:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5437') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'dbt') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'dbt') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'portifolio') }}"
      schema: public
      threads: 4
