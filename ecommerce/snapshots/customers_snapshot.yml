snapshots:
  - name: clientes_snapshot
    relation: source('varejo', 'origem_cliente')
    config:
      unique_key: cliente_id
      strategy: timestamp
      updated_at: updated_at
      schema: analytics_varejo
    description: >
      Snapshot SCD Tipo 2 dos clientes do varejo.
      Captura histórico de mudanças em segmento e estado.
      Cenário didático: execute dbt snapshot antes e após atualizar um cliente.

    columns:
      - name: cliente_id
        description: Chave primária do cliente.
      - name: dbt_scd_id
        description: Chave surrogate única por linha do snapshot.
      - name: dbt_updated_at
        description: Timestamp de escrita desta linha do snapshot.
      - name: dbt_valid_from
        description: Início do período de validade desta versão.
      - name: dbt_valid_to
        description: Fim do período de validade. NULL = versão ativa atual.

