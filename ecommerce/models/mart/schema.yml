version: 2
models:
- name: dim_customers
  description: 'Customer dimension used by analytical models. Grain: one row per customer.

    '
  config:
    tags:
    - marts
  columns:
  - name: customer_id
    data_tests:
    - not_null
    - unique
  - name: email
    data_tests:
    - not_null
    - unique
  - name: country_code
    data_tests:
    - not_null
  - name: country_name
    data_tests:
    - not_null
  - name: region
    data_tests:
    - not_null
  - name: currency
    data_tests:
    - not_null
  - name: deleted_at
    description: Soft deletion timestamp carried from the OLTP customer record.
- name: fct_orders
  description: 'Atomic order fact table. Grain: one row per order. Soft-deleted records
    are retained; downstream aggregations filter them.

    '
  config:
    contract:
      enforced: true
    tags:
    - marts
    - finance
    - incremental
  columns:
  - name: order_id
    description: Unique order identifier.
    data_type: bigint
    data_tests:
    - not_null
    - unique
  - name: customer_id
    description: Customer that placed the order.
    data_type: bigint
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_customers')
          field: customer_id
  - name: salesperson_id
    description: Salesperson that handled the order.
    data_type: bigint
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_salespeople')
          field: salesperson_id
  - name: order_date
    description: Date the order was placed.
    data_type: date
    data_tests:
    - not_null
  - name: amount
    description: Gross order amount.
    data_type: numeric(12, 2)
    data_tests:
    - not_null
    - positive_values:
        config:
          severity: warn
  - name: status
    description: Current operational status.
    data_type: text
    data_tests:
    - not_null
  - name: is_paid
    description: 1 if the order was paid, 0 otherwise.
    data_type: integer
  - name: is_cancelled
    description: 1 if the order was cancelled, 0 otherwise.
    data_type: integer
  - name: is_refunded
    description: 1 if the order was refunded, 0 otherwise.
    data_type: integer
  - name: recognized_revenue
    description: Amount recognized as revenue (non-zero only for paid orders).
    data_type: numeric(12, 2)
    data_tests:
    - not_null
  - name: refunded_amount
    description: Amount refunded (non-zero only for refunded orders).
    data_type: numeric(12, 2)
    data_tests:
    - not_null
  - name: created_at
    description: Timestamp when the order was created.
    data_type: timestamp without time zone
    data_tests:
    - not_null
  - name: updated_at
    description: Timestamp of the latest modification.
    data_type: timestamp without time zone
    data_tests:
    - not_null
  - name: deleted_at
    description: Soft deletion timestamp. NULL = active order. Retained in the fact
      table; analytical aggregations exclude deleted rows.
    data_type: timestamp without time zone
- name: mart_customer_sales
  description: 'Business-facing customer sales summary. Grain: one row per customer.

    '
  config:
    tags:
    - marts
    - finance
  columns:
  - name: customer_id
    data_tests:
    - not_null
    - unique
  - name: total_orders
    data_tests:
    - not_null
  - name: paid_orders
    data_tests:
    - not_null
  - name: cancelled_orders
    data_tests:
    - not_null
  - name: refunded_orders
    data_tests:
    - not_null
  - name: revenue
    data_tests:
    - not_null

- name: dim_products
  description: Product dimension used to analyze catalog performance and item-level sales.
  config:
    tags:
    - marts
    - products
  columns:
  - name: product_id
    data_tests:
    - not_null
    - unique
  - name: product_name
    data_tests:
    - not_null
  - name: category
    data_tests:
    - not_null
  - name: unit_price
    data_tests:
    - not_null
  - name: is_active
    data_tests:
    - not_null
  - name: deleted_at
    description: Soft deletion timestamp carried from the OLTP product record.

- name: dim_salespeople
  description: Salesperson dimension used for revenue attribution and regional performance.
  config:
    tags:
    - marts
    - sales
  columns:
  - name: salesperson_id
    data_tests:
    - not_null
    - unique
  - name: salesperson_name
    data_tests:
    - not_null
  - name: region
    data_tests:
    - not_null
  - name: email
    data_tests:
    - not_null
    - unique
  - name: deleted_at
    description: Soft deletion timestamp carried from the OLTP salesperson record.

- name: fct_order_items
  description: >
    Atomic sales line-item fact table. Grain: one row per order item.
  config:
    tags:
    - marts
    - sales
  columns:
  - name: order_item_id
    data_tests:
    - not_null
    - unique
  - name: order_id
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('fct_orders')
          field: order_id
  - name: product_id
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_products')
          field: product_id
  - name: quantity
    data_tests:
    - not_null
  - name: unit_price
    data_tests:
    - not_null
  - name: amount
    data_tests:
    - not_null
  - name: created_at
    data_tests:
    - not_null
  - name: updated_at
    data_tests:
    - not_null
  - name: deleted_at
    description: Soft deletion timestamp carried from the OLTP order item record.

- name: mart_sales_by_salesperson
  description: Sales summary grouped by salesperson, region and order volume.
  config:
    tags:
    - marts
    - sales
  columns:
  - name: salesperson_id
    data_tests:
    - not_null
    - unique
  - name: salesperson_name
    data_tests:
    - not_null
  - name: region
    data_tests:
    - not_null
  - name: total_orders
    data_tests:
    - not_null
  - name: revenue
    data_tests:
    - not_null
