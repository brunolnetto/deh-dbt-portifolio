version: 2

models:
  - name: stg_customers
    description: >
      Cleaned and normalized customer records from the transactional source.
      One row represents one customer.

    columns:
      - name: customer_id
        description: Unique customer identifier.
        data_tests:
          - not_null
          - unique

      - name: customer_name
        description: Trimmed customer name.
        data_tests:
          - not_null

      - name: email
        description: Normalized lowercase customer email.
        data_tests:
          - not_null
          - unique

      - name: country_code
        description: Normalized uppercase country code.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('country_codes')
                field: country_code

      - name: created_at
        data_tests:
          - not_null

      - name: updated_at
        data_tests:
          - not_null

      - name: deleted_at
        description: Soft deletion timestamp propagated from the OLTP source.


  - name: stg_orders
    description: >
      Cleaned representation of transactional orders.
      One row represents one order.

    columns:
      - name: order_id
        description: Unique order identifier.
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: Customer responsible for the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: salesperson_id
        description: Salesperson responsible for the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_salespeople')
                field: salesperson_id

      - name: order_date
        description: Date when the order was placed.
        data_tests:
          - not_null

      - name: amount
        description: Order amount.
        data_tests:
          - not_null

      - name: status
        description: Normalized order status.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - pending
                  - paid
                  - cancelled
                  - refunded

      - name: created_at
        data_tests:
          - not_null

      - name: updated_at
        data_tests:
          - not_null

      - name: deleted_at
        description: >-
          Soft deletion timestamp propagated from the OLTP source.
          NULL = active order. Not filtered here; downstream models decide.

  - name: stg_salespeople
    description: >
      Cleaned and normalized salesperson reference data.
      One row represents one salesperson.

    columns:
      - name: salesperson_id
        description: Unique salesperson identifier.
        data_tests:
          - not_null
          - unique

      - name: salesperson_name
        description: Salesperson trimmed name.
        data_tests:
          - not_null

      - name: email
        description: Normalized lowercase email.
        data_tests:
          - not_null
          - unique

      - name: region
        description: Sales region normalized to a consistent label.
        data_tests:
          - not_null

      - name: created_at
        data_tests:
          - not_null

      - name: updated_at
        data_tests:
          - not_null

      - name: deleted_at
        description: Soft deletion timestamp propagated from the OLTP source.

  - name: stg_products
    description: >
      Cleaned product catalog data from the transactional source.
      One row represents one product.

    columns:
      - name: product_id
        description: Unique product identifier.
        data_tests:
          - not_null
          - unique

      - name: product_name
        description: Trimmed product name.
        data_tests:
          - not_null

      - name: category
        description: Product category.
        data_tests:
          - not_null

      - name: unit_price
        description: Catalog unit price.
        data_tests:
          - not_null

      - name: is_active
        description: Indicates whether the product remains active.
        data_tests:
          - not_null

      - name: created_at
        data_tests:
          - not_null

      - name: updated_at
        data_tests:
          - not_null

      - name: deleted_at
        description: Soft deletion timestamp propagated from the OLTP source.

  - name: stg_order_items
    description: >
      Cleaned line items from transactional orders.
      One row represents one product within an order.

    columns:
      - name: order_item_id
        description: Unique order-item identifier.
        data_tests:
          - not_null
          - unique

      - name: order_id
        description: Parent order identifier.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: product_id
        description: Product identifier for the line item.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

      - name: quantity
        description: Quantity ordered.
        data_tests:
          - not_null

      - name: unit_price
        description: Product unit price at time of transaction.
        data_tests:
          - not_null

      - name: amount
        description: Extended line item amount.
        data_tests:
          - not_null

      - name: created_at
        data_tests:
          - not_null

      - name: updated_at
        data_tests:
          - not_null

      - name: deleted_at
        description: Soft deletion timestamp propagated from the OLTP source.
