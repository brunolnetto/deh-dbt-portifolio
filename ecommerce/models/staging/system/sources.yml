version: 2

sources:
  - name: system
    description: Operational logs written directly by services.
    schema: system

    tables:
      - name: request_log
        description: One row per HTTP request received by oltp-api.
        columns:
          - name: id
            data_tests: [not_null, unique]
          - name: service
            data_tests: [not_null]
          - name: method
            data_tests: [not_null]
          - name: endpoint
            data_tests: [not_null]
          - name: status_code
            data_tests: [not_null]
          - name: created_at
            data_tests: [not_null]

      - name: app_log
        description: Structured application log entries.
