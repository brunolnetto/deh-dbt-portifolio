version: 2

sources:
  - name: shop
    description: Transactional source database used by the shop application.

    schema: shop

    tables:
      - name: customers
        description: Operational customer records.

        columns:
          - name: customer_id
            description: Primary key of the customer.
            data_tests:
              - not_null
              - unique

          - name: name
            description: Customer name.
            data_tests:
              - not_null

          - name: email
            description: Customer email as stored by the transactional system.
            data_tests:
              - not_null

          - name: country_code
            description: Two-letter country code provided by the application.
            data_tests:
              - not_null

          - name: created_at
            description: Timestamp when the customer was created.
            data_tests:
              - not_null

          - name: updated_at
            description: Timestamp of the latest modification.
            data_tests:
              - not_null

          - name: deleted_at
            description: Soft delete timestamp for the customer.

      - name: orders
        description: Operational customer orders.

        columns:
          - name: order_id
            description: Primary key of the order.
            data_tests:
              - not_null
              - unique

          - name: customer_id
            description: Customer that owns the order.
            data_tests:
              - not_null

          - name: salesperson_id
            description: Salesperson responsible for the order.
            data_tests:
              - not_null

          - name: order_date
            description: Timestamp when the order was placed.
            data_tests:
              - not_null

          - name: amount
            description: Monetary amount stored in the transactional system.
            data_tests:
              - not_null

          - name: status
            description: Current operational status of the order.
            data_tests:
              - not_null

          - name: created_at
            description: Timestamp when the order was created.
            data_tests:
              - not_null

          - name: updated_at
            description: Timestamp of the latest modification.
            data_tests:
              - not_null

          - name: deleted_at
            description: Soft delete timestamp for the order.

      - name: salespeople
        description: Operational salespeople assigned to orders.

        columns:
          - name: salesperson_id
            description: Primary key of the salesperson.
            data_tests:
              - not_null
              - unique

          - name: name
            description: Salesperson full name.
            data_tests:
              - not_null

          - name: email
            description: Salesperson email address.
            data_tests:
              - not_null

          - name: region
            description: Sales region associated with the seller.
            data_tests:
              - not_null

          - name: created_at
            description: Timestamp when the salesperson was created.
            data_tests:
              - not_null

          - name: updated_at
            description: Timestamp of the latest modification.
            data_tests:
              - not_null

          - name: deleted_at
            description: Soft delete timestamp for the salesperson.

      - name: products
        description: Catalog of commercial products sold by the shop.

        columns:
          - name: product_id
            description: Primary key of the product.
            data_tests:
              - not_null
              - unique

          - name: name
            description: Product name.
            data_tests:
              - not_null

          - name: category
            description: Product category.
            data_tests:
              - not_null

          - name: unit_price
            description: Catalog unit price of the product.
            data_tests:
              - not_null

          - name: is_active
            description: Whether the product is active in the catalog.
            data_tests:
              - not_null

          - name: created_at
            description: Timestamp when the product was created.
            data_tests:
              - not_null

          - name: updated_at
            description: Timestamp of the latest modification.
            data_tests:
              - not_null

          - name: deleted_at
            description: Soft delete timestamp for the product.

      - name: order_items
        description: Line items composing each order.

        columns:
          - name: order_item_id
            description: Primary key of the order item.
            data_tests:
              - not_null
              - unique

          - name: order_id
            description: Parent order for this item.
            data_tests:
              - not_null

          - name: product_id
            description: Product referenced by the item.
            data_tests:
              - not_null

          - name: quantity
            description: Quantity ordered for the product.
            data_tests:
              - not_null

          - name: unit_price
            description: Price charged per product unit at order placement.
            data_tests:
              - not_null

          - name: amount
            description: Extended amount for the line item.
            data_tests:
              - not_null

          - name: created_at
            description: Timestamp when the order item was created.
            data_tests:
              - not_null

          - name: updated_at
            description: Timestamp of the latest modification.
            data_tests:
              - not_null

          - name: deleted_at
            description: Soft delete timestamp for the order item.

