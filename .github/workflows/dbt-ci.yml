name: dbt CI — Portfolio

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  dbt-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dbt
          POSTGRES_PASSWORD: dbt
          POSTGRES_DB: portifolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: dbt
      POSTGRES_PASSWORD: dbt
      POSTGRES_DB: portifolio

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Seed OLTP schemas (varejo + biblioteca + rede_social)
        run: PGPASSWORD=dbt psql -h localhost -U dbt -d portifolio -f oltp/init.sql

      - name: Write dbt profiles
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          portfolio:
            target: ci
            outputs:
              ci:
                type: postgres
                host: localhost
                port: 5432
                user: dbt
                password: dbt
                dbname: portifolio
                schema: public
                threads: 4
          EOF

      - name: dbt parse
        working-directory: ecommerce
        run: uv run dbt parse

      - name: dbt seed
        working-directory: ecommerce
        run: uv run dbt seed

      - name: dbt build — varejo
        working-directory: ecommerce
        run: uv run dbt build --select tag:varejo

      - name: dbt build — biblioteca
        working-directory: ecommerce
        run: uv run dbt build --select tag:biblioteca

      - name: dbt build — rede_social
        working-directory: ecommerce
        run: uv run dbt build --select tag:rede_social

      - name: dbt build — system
        working-directory: ecommerce
        run: uv run dbt build --select tag:system

      # Seed landing tables with sample data (CI only — extractor runs in docker-compose locally)
      - name: Seed landing tables with sample data
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d portifolio -c \
            "INSERT INTO landing_varejo.clientes (cliente_id, nome, estado, segmento, data_cadastro, updated_at) VALUES (101, 'João Silva', 'SP', 'Ouro', '2023-01-15', now()), (102, 'Maria Santos', 'RJ', 'Bronze', '2023-05-20', now()), (103, 'Pedro Costa', 'MG', 'Prata', '2024-02-10', now());
           INSERT INTO landing_varejo.produtos (produto_id, nome_produto, categoria, preco_sugerido, updated_at) VALUES ('PROD001', 'Notebook Dell i5', 'Informática', 3500.00, now()), ('PROD002', 'Mouse Logitech MX', 'Informática', 250.00, now()), ('PROD003', 'Teclado Mecânico RGB', 'Informática', 350.00, now());
           INSERT INTO landing_varejo.vendas (venda_id, data_venda, produto_id, cliente_id, quantidade, valor_total, status, created_at, updated_at) VALUES (1, '2024-05-04', 'PROD001', 101, 1, 3500.00, 'pago', now(), now()), (2, '2024-05-05', 'PROD001', 101, 2, 7000.00, 'pago', now(), now()), (3, '2024-06-15', 'PROD003', 101, 1, 350.00, 'pago', now(), now());
           INSERT INTO landing_biblioteca.usuarios (usuario_id, nome, tipo, email, updated_at) VALUES (201, 'João Ferreira', 'aluno', 'joao@biblioteca.br', now()), (202, 'Maria Oliveira', 'professor', 'maria@biblioteca.br', now());
           INSERT INTO landing_biblioteca.livros (livro_id, titulo, isbn, ano_publicacao, quantidade_disponivel, updated_at) VALUES (301, 'Dom Casmurro', '9788520927978', 1899, 3, now()), (302, 'A Hora da Estrela', '9788532518101', 1977, 2, now());
           INSERT INTO landing_biblioteca.emprestimos (emprestimo_id, usuario_id, livro_id, data_emprestimo, data_devolucao_prevista, data_devolucao_real, updated_at) VALUES (401, 201, 301, '2024-05-01', '2024-06-01', NULL, now()), (402, 202, 302, '2024-05-10', '2024-06-10', '2024-05-25', now());
           INSERT INTO landing_biblioteca.autores (autor_id, nome, nacionalidade, data_nascimento, updated_at) VALUES (501, 'Machado de Assis', 'Brasileiro', '1839-06-21', now()), (502, 'Clarice Lispector', 'Brasileira', '1920-12-10', now());
           INSERT INTO landing_biblioteca.multas (multa_id, emprestimo_id, valor_multa, pago, updated_at) VALUES (601, 402, 15.00, TRUE, now());
           INSERT INTO landing_rede_social.pessoas (pessoa_id, nome, idade, updated_at) VALUES (701, 'Alice Silva', 28, now()), (702, 'Bruno Costa', 35, now()), (703, 'Carla Santos', 31, now());
           INSERT INTO landing_rede_social.leituras (pessoa_id, livro_id, nota, data_leitura, updated_at) VALUES (701, 301, 4.5, '2024-05-01', now()), (702, 302, 5.0, '2024-05-05', now()), (703, 301, 4.0, '2024-05-10', now());
           INSERT INTO landing_rede_social.conexoes (seguidor_id, seguido_id, forca_conexao, data_conexao, updated_at) VALUES (701, 702, 0.95, '2024-01-01', now()), (702, 703, 0.87, '2024-01-15', now()), (703, 701, 0.92, '2024-02-01', now());
           INSERT INTO landing_rede_social.generos (genero_id, nome, updated_at) VALUES (801, 'Romance', now()), (802, 'Ficção Científica', now()), (803, 'Mistério', now());
           INSERT INTO landing_rede_social.livros (livro_id, titulo, autor, ano_publicacao, updated_at) VALUES (301, 'Dom Casmurro', 'Machado de Assis', 1899, now()), (302, 'A Hora da Estrela', 'Clarice Lispector', 1977, now()), (303, 'Grande Sertão: Veredas', 'Guimarães Rosa', 1956, now());"

      # Quality Gates — Run after dbt build populates landing tables
      - name: Install quality dependencies
        run: pip install great-expectations soda-core-postgres pytest psycopg pandas sqlalchemy python-dotenv -q

      - name: pytest — Landing table quality checks
        run: cd quality && python -m pytest tests/test_pipeline.py -v

      - name: Great Expectations — Column-level validations
        run: cd quality && python -m pytest tests/test_ge_landing.py -v

      - name: SODA Core — Landing table checks (varejo, biblioteca, rede_social)
        run: cd quality && python -m pytest tests/test_soda_landing.py -v
