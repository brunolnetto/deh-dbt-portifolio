[project]
name = "portfolio-api"
version = "1.0.0"
description = "REST and MCP interface over the DEH Portfolio Analytics warehouse (varejo + biblioteca + rede_social)."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[pool,binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "mcp>=1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_api"]

[tool.uv]
dev-dependencies = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]
